name: دورة كاملة — تحليل ونشر

on:
  schedule:
    - cron: '0 */4 * * *'      # كل 4 ساعات
  workflow_dispatch:

permissions:
  contents: write

# يمنع تشغيلين في نفس الوقت — ده كان بيسبب تعارض في git push
concurrency:
  group: aqar-full
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: تشغيل الدورة
        run: python monitor.py --once
        env:
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_API_KEY:    ${{ secrets.YOUTUBE_API_KEY }}

      - name: حفظ النتائج
        run: |
          git config user.name  "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A state latest.json index.html beit-alwatan.html
          git diff --staged --quiet && exit 0
          git commit -m "تحديث تلقائي — $(date -u '+%Y-%m-%d %H:%M UTC')"
          # إعادة المحاولة لو حد عمل push في نفس اللحظة
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && \
            git push && exit 0
            sleep 5
          done
          exit 1
